<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cadernos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F5; --chrome:#F7F8FB; --paper:#FFFFFF; --ink:#1C2132; --muted:#646B80; --line:#D9DCE6; --line-strong:#B9BECD;
  --accent:#3F3C9A; --accent-ink:#FFFFFF; --accent-soft:#E6E5F6; --danger:#B3261E;
  --sec:#C3C3F2;
  --ui:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --text-font:var(--serif); --text-size:17px; --sheet-w:820px; --side-w:240px; --sheet-ml:0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13151C; --chrome:#191C25; --paper:#1E212B; --ink:#E4E6EE; --muted:#9A9FB2; --line:#2C303D; --line-strong:#454B5E;
    --accent:#AEAAF5; --accent-ink:#15162A; --accent-soft:#2B2A4A; --danger:#F2A69F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13151C; --chrome:#191C25; --paper:#1E212B; --ink:#E4E6EE; --muted:#9A9FB2; --line:#2C303D; --line-strong:#454B5E;
  --accent:#AEAAF5; --accent-ink:#15162A; --accent-soft:#2B2A4A; --danger:#F2A69F; color-scheme:dark;
}
:root[data-font="sans"]{--text-font:var(--ui)}
:root[data-size="s"]{--text-size:15.5px} :root[data-size="l"]{--text-size:19px} :root[data-size="xl"]{--text-size:21px}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--ui);-webkit-text-size-adjust:100%;overflow:hidden}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--chrome);border-bottom:1px solid var(--line)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted)}
.icon-btn:hover{background:var(--accent-soft);color:var(--ink)}
.nb-btn{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;padding:6px 8px;border-radius:8px;font-weight:600;font-size:17px;letter-spacing:-.01em;max-width:40vw}
.nb-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb-btn:hover{background:var(--accent-soft)}
.search{flex:1;min-width:0;max-width:420px;margin-left:auto;position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:36px;border:1px solid var(--line);border-radius:18px;background:var(--paper);padding:0 12px 0 34px;outline:none}
.search input:focus{border-color:var(--accent)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:#3E9B5B}
.status[data-k="pending"]::before{background:#D29A1F}
.status[data-k="err"]::before{background:var(--danger)}
.status[data-k="local"]::before{background:var(--muted)}

.tabs{display:flex;align-items:flex-end;gap:3px;padding:8px 12px 0;background:var(--chrome);overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line-strong)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid transparent;border-bottom:0;background:color-mix(in srgb,var(--c) 70%,var(--chrome));color:#1C2132;padding:6px 14px 7px;border-radius:8px 8px 0 0;font-size:14px;font-weight:500;white-space:nowrap;margin-bottom:-1px}
.tab:hover{background:var(--c)}
.tab.active{background:var(--c);border-color:var(--line-strong);padding-top:9px;font-weight:600;position:relative;z-index:1}
.tab.add{background:transparent;color:var(--muted);padding:6px 10px;display:inline-flex}
.tab.add:hover{background:var(--accent-soft);color:var(--ink)}

.body{flex:1;min-height:0;display:flex;position:relative}
.side{width:var(--side-w);position:relative;flex:none;display:flex;flex-direction:column;background:color-mix(in srgb,var(--sec) 30%,var(--chrome));border-right:1px solid var(--line)}
.side-head{padding:10px}
.add-page{width:100%;display:flex;align-items:center;gap:6px;border:1px dashed var(--line-strong);background:color-mix(in srgb,var(--paper) 55%,transparent);border-radius:8px;padding:8px 10px;color:var(--ink);font-weight:500}
.add-page:hover{background:var(--paper)}
.pages{list-style:none;margin:0;padding:0 6px 16px;overflow-y:auto;flex:1}
.pages li{display:flex;align-items:center;border-radius:7px;margin:1px 0}
.pages li button.pg{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:7px 10px;border-radius:7px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pages li.l1 button.pg{padding-left:26px;font-size:13.5px}
.pages li:hover{background:color-mix(in srgb,var(--paper) 50%,transparent)}
.pages li.active{background:var(--paper);box-shadow:inset 3px 0 0 var(--accent)}
.pages li.active button.pg{font-weight:600}
.pages li .more{width:30px;height:30px;flex:none;color:var(--muted)}
.pages .hint{padding:10px 12px;color:var(--muted);font-size:13.5px}
.untitled{color:var(--muted);font-style:italic}

main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--paper)}
.toolbar{display:flex;align-items:center;gap:2px;padding:6px 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin;flex:none;background:var(--paper)}
.toolbar.disabled{opacity:.45;pointer-events:none}
.tb{height:34px;min-width:34px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:7px;background:transparent;color:var(--ink);padding:0 6px;flex:none}
.tb:hover{background:var(--accent-soft)}
.tb.on{background:var(--accent-soft);color:var(--accent)}
.tb.txt{font-size:15px;width:34px}
.tb.narrow{min-width:20px;width:20px;padding:0;color:var(--muted)}
.sep{width:1px;height:22px;background:var(--line);margin:0 6px;flex:none}
.tbsel{height:34px;border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:0 6px;flex:none;font-size:14px}
.swatch-ico{display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1}
.swatch-ico i{display:block;width:18px;height:4px;border-radius:2px;background:var(--hl)}
.tag-btn{font-size:12px;font-weight:600;padding:0 8px}
.tablebar{display:flex;align-items:center;gap:4px;padding:6px 12px;background:var(--accent-soft);border-bottom:1px solid var(--line);overflow-x:auto;flex:none;font-size:13.5px}
.tablebar[hidden]{display:none}
.tablebar b{margin-right:6px;font-weight:600}
.chip{border:1px solid var(--line-strong);background:var(--paper);border-radius:16px;padding:5px 11px;white-space:nowrap;flex:none}
.chip.danger{color:var(--danger)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:9px 14px;background:#FFF3CD;color:#4A3B00;border-bottom:1px solid #E7D48A;font-size:14px;flex:none}
.banner[hidden]{display:none}
.banner .chip{color:#1C2132;background:#fff}

.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.sheet{position:relative;max-width:var(--sheet-w);margin-left:var(--sheet-ml);margin-right:auto;padding:28px 40px 120px}
.grip{position:absolute;top:0;bottom:0;width:18px;cursor:col-resize;touch-action:none;z-index:5}
.grip::after{content:"";position:absolute;top:0;bottom:0;left:8px;width:2px;border-radius:2px;background:transparent;transition:background .15s}
.grip:hover::after,.grip.drag::after{background:var(--accent)}
.sheet>.grip{right:-9px}
.sheet>.grip::before{content:"";position:absolute;top:40px;left:4px;width:10px;height:36px;border-radius:5px;border:1px solid var(--line-strong);background:var(--paper)}
.sheet>.grip:hover::before,.sheet>.grip.drag::before{border-color:var(--accent)}
.side>.grip{right:-9px}
.wlabel{position:fixed;z-index:80;background:var(--ink);color:var(--paper);font-size:12.5px;padding:4px 8px;border-radius:6px;pointer-events:none;display:none}
.sheet[hidden]{display:none}
.page-title{width:100%;border:0;border-bottom:1px solid var(--line);outline:none;background:transparent;font:600 28px/1.25 var(--ui);letter-spacing:-.015em;padding:4px 0 8px}
.page-title::placeholder{color:var(--line-strong)}
.page-meta{color:var(--muted);font-size:13px;margin:8px 0 22px}
.editor{outline:none;min-height:50vh;overflow-x:auto}
:root[data-font="sans"] .rich{line-height:1.5}
.editor.loading{opacity:.3}
.rich p{margin:0 0 .7em}
.rich h1,.rich h2,.rich h3{font-family:var(--ui);letter-spacing:-.01em;line-height:1.25;margin:1.2em 0 .5em}
.rich h1{font-size:1.55em} .rich h2{font-size:1.28em} .rich h3{font-size:1.08em}
.rich blockquote{margin:0 0 .8em;padding:.2em 0 .2em 1em;border-left:3px solid var(--accent);color:var(--muted)}
.rich ul,.rich ol{margin:0 0 .7em;padding-left:1.6em}
.rich table{border-collapse:collapse;margin:.4em 0 1em;font-size:.94em}
.rich td,.rich th{border:1px solid var(--line-strong);padding:6px 9px;min-width:4em;vertical-align:top;text-align:left}
.rich th{background:var(--accent-soft);font-weight:600}
.rich [style*="background-color"]{color:#1C2132}
.tag{display:inline-block;font:600 11px/1.6 var(--ui);padding:0 6px;border-radius:4px;background:#E3E5EA;color:#3D4353;user-select:none;-webkit-user-select:none;white-space:nowrap}
.rich .tag{margin-right:7px;vertical-align:.18em}
.rich{font-family:var(--text-font);font-size:var(--text-size);line-height:1.6;overflow-wrap:anywhere}
.study-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:18px;height:34px;padding:0 12px 0 10px;font-weight:500;font-size:14px}
.study-btn:hover,.study-btn.on{border-color:var(--accent);color:var(--accent)}
.study{max-width:var(--sheet-w);margin-left:var(--sheet-ml);margin-right:auto;padding:28px 40px 120px}
.study[hidden]{display:none}
.study h2{font:600 26px/1.25 var(--ui);letter-spacing:-.015em;margin:0 0 4px}
.study .sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.fchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.fchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--paper);border-radius:18px;padding:4px 11px 4px 5px;font-size:13px;color:var(--muted)}
.fchip .tag{font-size:12px}
.fchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);color:var(--ink)}
.fopts{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:8px;font-size:14px}
.fopts select{height:34px;border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:0 6px;max-width:100%}
.fopts label{display:inline-flex;align-items:center;gap:6px}
.grp-sec{display:inline-block;background:var(--c);color:#1C2132;border-radius:6px;padding:2px 10px;font:600 13px var(--ui);margin:26px 0 4px}
.grp-page{font:600 18px/1.3 var(--ui);margin:10px 0 10px;letter-spacing:-.01em}
.hit{border-left:3px solid var(--line-strong);padding:2px 0 2px 16px;margin:0 0 18px}
.hit .ctx{opacity:.5}
.hit .open{border:0;background:none;color:var(--accent);font:600 13.5px var(--ui);padding:2px 0}
.study .note{color:var(--muted);padding:24px 0}
.tagrows{display:flex;flex-direction:column;gap:6px;margin:4px 0 12px;max-height:50vh;overflow:auto}
.tagrow{display:flex;align-items:center;gap:6px}
.tagrow .dot{width:26px;height:26px;border-radius:50%;border:2px solid;flex:none}
.tagrow input{flex:1;min-width:0;height:36px;border:1px solid var(--line-strong);border-radius:7px;padding:0 9px;background:var(--paper);font-size:15px}
.tagrow .kbd{font-size:11.5px;color:var(--muted);width:44px;text-align:right;flex:none}
.tagrow .icon-btn{width:30px;height:30px;flex:none}
::highlight(hit){background:#FFD54F;color:#1C2132}

.empty{padding:60px 40px;max-width:520px}
.empty[hidden]{display:none}
.empty h2{font-size:22px;margin:0 0 8px;letter-spacing:-.01em}
.empty p{color:var(--muted);margin:0 0 18px}
.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{background:var(--danger);color:#fff}

.menu{position:fixed;z-index:50;min-width:220px;max-width:min(320px,92vw);max-height:70vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(20,22,40,.18),0 2px 6px rgba(20,22,40,.08);padding:5px}
.menu button.mi{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px;font-size:14px}
.menu button.mi:hover{background:var(--accent-soft)}
.menu button.mi.danger{color:var(--danger)}
.menu button.mi .ck{width:14px;color:var(--accent);font-weight:700}
.menu .mhead{padding:8px 10px 4px;font-size:12.5px;color:var(--muted);font-weight:600}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .sw{display:flex;flex-wrap:wrap;gap:6px;padding:6px 10px 8px}
.menu .sw button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line-strong)}
.menu .sw button.none{background:var(--paper);position:relative;overflow:hidden}
.menu .sw button.none::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;border-top:1.5px solid var(--danger);transform:rotate(-45deg)}

.modal-wrap{position:fixed;inset:0;z-index:60;background:rgba(15,17,30,.38);display:flex;align-items:flex-start;justify-content:center;padding:14vh 16px 16px}
.modal{background:var(--paper);border-radius:12px;padding:20px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{font-size:18px;margin:0 0 12px}
.modal p{margin:0 0 14px;color:var(--muted)}
.modal label{display:block;font-size:13.5px;color:var(--muted)}
.modal input[type=text]{display:block;width:100%;margin-top:6px;height:40px;border:1px solid var(--line-strong);border-radius:8px;padding:0 10px;background:var(--paper);outline:none;font-size:16px}
.modal input[type=text]:focus{border-color:var(--accent)}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin:4px 0 10px;touch-action:none}
.grid i{aspect-ratio:1;border:1px solid var(--line-strong);border-radius:3px;background:var(--paper)}
.grid i.on{background:var(--accent-soft);border-color:var(--accent)}
.grid-label{font-weight:600;font-size:14px;min-height:20px}
.chk{display:flex!important;align-items:center;gap:8px;margin-top:6px;color:var(--ink)!important}

.search-panel{position:fixed;z-index:40;width:min(520px,94vw);max-height:65vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(20,22,40,.2);padding:6px}
.search-panel[hidden]{display:none}
.search-panel .res{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:7px;padding:9px 10px}
.search-panel .res:hover{background:var(--accent-soft)}
.search-panel .res strong{display:block;font-size:14.5px}
.search-panel .res small{color:var(--muted);font-size:12.5px}
.search-panel .res span{display:block;font-size:13.5px;color:var(--muted);margin-top:3px;font-family:var(--text-font)}
.search-panel mark{background:#FFE58A;color:#1C2132;border-radius:2px}
.search-panel .note{padding:10px;color:var(--muted);font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;font-size:14px;z-index:70;transition:opacity .2s,transform .2s;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}
.only-narrow{display:none}

@media (max-width:820px){
  .grip{display:none}
  .side{width:260px}
  .study-btn span{display:none}
  .study{padding:20px 18px 100px}
  .only-narrow{display:inline-flex}
  .side{position:absolute;left:0;top:0;bottom:0;z-index:30;transform:translateX(-105%);transition:transform .22s ease;box-shadow:6px 0 24px rgba(0,0,0,.15);background:color-mix(in srgb,var(--sec) 30%,var(--chrome))}
  body.drawer-open .side{transform:none}
  body.drawer-open .scrim{display:block;position:absolute;inset:0;z-index:25;background:rgba(15,17,30,.3)}
  .sheet{padding:20px 18px 100px}
  .status .st-text{display:none}
  .page-title{font-size:23px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.top,.tabs,.side,.toolbar,.tablebar,.banner{display:none!important}body{overflow:visible}.scroll{overflow:visible}}
</style>
<style id="tagcss"></style>
</head>
<body>
<div id="app">
  <header class="top">
    <button id="drawerBtn" class="icon-btn only-narrow" aria-label="Mostrar páginas"></button>
    <button id="nbBtn" class="nb-btn" aria-haspopup="menu"><span id="nbName">Carregando…</span><i id="nbCaret"></i></button>
    <button id="studyBtn" class="study-btn" title="Estudar por marcador"><i id="studyIco"></i><span>Estudar</span></button>
    <div class="search"><i id="searchIco"></i><input id="q" type="search" placeholder="Buscar em todos os cadernos" enterkeyhint="search" autocomplete="off"></div>
    <span id="status" class="status" data-k="pending"><span class="st-text">Conectando…</span></span>
    <button id="prefsBtn" class="icon-btn" aria-label="Preferências"></button>
  </header>
  <nav id="tabs" class="tabs" aria-label="Abas"></nav>
  <div class="body">
    <aside id="side" class="side" aria-label="Páginas"><div class="grip" id="sideGrip" title="Arraste para ajustar a largura da lista de páginas"></div>
      <div class="side-head"><button id="addPage" class="add-page"></button></div>
      <ul id="pageList" class="pages"></ul>
    </aside>
    <div id="scrim" class="scrim"></div>
    <main>
      <div id="toolbar" class="toolbar disabled" role="toolbar" aria-label="Formatação"></div>
      <div id="tablebar" class="tablebar" hidden>
        <b>Tabela</b>
        <button class="chip" data-t="rowAbove">+ Linha acima</button>
        <button class="chip" data-t="rowBelow">+ Linha abaixo</button>
        <button class="chip" data-t="colLeft">+ Coluna à esquerda</button>
        <button class="chip" data-t="colRight">+ Coluna à direita</button>
        <button class="chip danger" data-t="delRow">Excluir linha</button>
        <button class="chip danger" data-t="delCol">Excluir coluna</button>
        <button class="chip danger" data-t="delTable">Excluir tabela</button>
      </div>
      <div id="localWarn" class="banner" hidden style="background:#FDE2E0;color:#6E1510;border-color:#F0B4AE">
        <span><b>Atenção:</b> o servidor de sincronização não foi encontrado. O que você escreve aqui fica <b>só neste aparelho</b> e não aparece nos outros.</span>
        <button class="chip" id="lwBackup">Baixar backup do que está aqui</button>
      </div>
      <div id="conflict" class="banner" hidden>
        <span>Esta página foi alterada em outro aparelho enquanto você editava aqui.</span>
        <button class="chip" id="cfTheirs">Carregar a versão do outro aparelho</button>
        <button class="chip" id="cfMine">Manter a minha</button>
      </div>
      <div id="scroll" class="scroll">
        <article id="sheet" class="sheet" hidden><div class="grip" id="sheetGrip" title="Arraste para ajustar a largura do texto. Toque duas vezes para voltar ao padrão."></div>
          <input id="title" class="page-title" placeholder="Título da página" autocomplete="off">
          <div id="meta" class="page-meta"></div>
          <div id="editor" class="editor rich" contenteditable="true" spellcheck="true" lang="pt-BR"></div>
        </article>
        <div id="filterView" class="study" hidden></div>
        <div id="empty" class="empty" hidden><h2 id="emptyH"></h2><p id="emptyP"></p><button id="emptyBtn" class="btn primary"></button></div>
      </div>
    </main>

<script>
(function(){

const COLORS=['#F4B6D8','#B9CFF5','#F7C79B','#C3C3F2','#F6E08F','#A9DCE0','#B9E3A6','#F2B3C6','#A8DDB5','#D9D4C7'];

const DEFAULT_TAGS=[{id:'stj',label:'STJ',c:0,order:1},{id:'stf',label:'STF',c:1,order:2},{id:'cespe',label:'CESPE',c:2,order:3},{id:'fcc',label:'FCC',c:3,order:4},{id:'fgv',label:'FGV',c:5,order:5},{id:'rev',label:'Revisar',c:4,order:6}];

const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}};

const ICONS={
 undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',

 ol:'<path d="M4 4.5h1.3v4.2M3.8 8.7h3M3.8 14c.3-.8 1-1.1 1.6-1.1.8 0 1.4.5 1.4 1.2 0 1.2-3 2.1-3 3.9h3.1M10 6.5h10M10 12h10M10 17.5h10"/>',
 outdent:'<path d="M4 5h16M11 10h9M11 14h9M4 19h16M8 9.5 5 12l3 2.5"/>',

 clear:'<path d="M6 19h8M9.5 15 14.5 5M8 5h11"/><path d="m4 11 7 7M11 11l-7 7"/>',
 hl:'<path d="m8.5 14.5 7.8-9a1.9 1.9 0 0 1 2.8-.1 1.9 1.9 0 0 1 0 2.8l-9 7.8"/><path d="m8.5 14.5-2 3.5 3.5-2"/>',
 menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>',
 more:'<circle cx="6" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.4" fill="currentColor" stroke="none"/>',
 search:'<circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/>',
 caret:'<path d="m7 10 5 5 5-5"/>',

 filter:'<path d="M4 5h16l-6 7.5V19l-4-2v-4.5z"/>'
};
const svg=(n,s=18)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

/* ---------- state ---------- */
const S={view:'page',tags:[],notebooks:[],sections:[],pages:[],loaded:{notebooks:false,sections:false,pages:false},
  nb:LS.get('oc-nb',null),sec:null,page:null,dirty:false,loadedRev:0,loadToken:0,conflict:false};
const byOrder=(a,b)=>(a.order||0)-(b.order||0)||String(a.id).localeCompare(String(b.id));
const nbById=id=>S.notebooks.find(x=>x.id===id);
const secById=id=>S.sections.find(x=>x.id===id);
const pageById=id=>S.pages.find(x=>x.id===id);
const secsOf=nb=>S.sections.filter(s=>s.notebookId===nb).sort(byOrder);
const pagesOf=sec=>S.pages.filter(p=>p.sectionId===sec).sort(byOrder);
const nextOrder=list=>list.reduce((m,x)=>Math.max(m,x.order||0),0)+1;
const tagList=()=>(S.tags.length?S.tags:DEFAULT_TAGS).slice().sort(byOrder);
const tagById=id=>tagList().find(t=>t.id===id);
const tagCol=t=>TAGCOL[(t&&t.c||0)%TAGCOL.length];
function mkTag(id){const t=tagById(id);const s=document.createElement('span');s.className='tag';s.dataset.tag=id;s.contentEditable='false';s.textContent=t?t.label:id;return s}
function syncTagLabels(root){root.querySelectorAll('.tag[data-tag]').forEach(s=>{const t=tagById(s.dataset.tag);if(t&&s.textContent!==t.label)s.textContent=t.label;s.setAttribute('contenteditable','false')})}
function onTags(){let css='';tagList().forEach(t=>{const[bg,fg]=tagCol(t);css+=`.tag[data-tag="${CSS.escape(t.id)}"]{background:${bg};color:${fg}}\n`});$('#tagcss').textContent=css;
  renderTagQuick();if(S.page&&S.view==='page')syncTagLabels(editor);if(S.view==='study')drawStudy()}
function upsertLocal(c,obj){const i=S[c].findIndex(x=>x.id===obj.id);if(i>=0)S[c][i]=Object.assign({},S[c][i],obj);else S[c].push(obj);S[c].sort(byOrder)}

/* ---------- storage ---------- */
let store=null;
async function withRetry(fn){try{return await fn()}catch(e){if(e&&e.code==='unavailable'){await sleep(400+Math.random()*700);return fn()}throw e}}
const COLLS=['notebooks','sections','pages','tags'];
function localStore(){const key=c=>'oc-local:'+c,subs={};const read=c=>LS.get(key(c),{});
  const list=c=>Object.entries(read(c)).map(([id,d])=>Object.assign({id},d));
  const write=(c,m)=>{if(!LS.set(key(c),m))throw{code:'quota_exceeded'};(subs[c]||[]).forEach(cb=>cb(list(c)))};
  return{kind:'local',start(){},
  watch(c,cb){(subs[c]=subs[c]||[]).push(cb);setTimeout(()=>cb(list(c)),0)},
  async set(c,id,d){const m=read(c);m[id]=JSON.parse(JSON.stringify(d));write(c,m)},
  async update(c,id,d){const m=read(c);if(!m[id])return;Object.assign(m[id],d);write(c,m)},
  async del(c,id){const m=read(c);delete m[id];write(c,m)},
  async getContent(id){return LS.get('oc-local-c:'+id,'')},
  async putContent(id,html){if(!LS.set('oc-local-c:'+id,html))throw{code:'quota_exceeded'}},
  async delContent(id){LS.del('oc-local-c:'+id)},
  async contents(ids){const o={};ids.forEach(id=>o[id]=LS.get('oc-local-c:'+id,''));return o},
  async exportMeta(){const m={};COLLS.forEach(c=>m[c]=read(c));return m},
  async replaceAll(meta){COLLS.forEach(c=>write(c,meta[c]||{}))}}}
function apiStore(key){
  const call=async(method,path,body)=>{let r;
    try{r=await fetch('/api/'+path,{method,cache:'no-store',headers:{'x-app-key':key,'content-type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)})}
    catch(e){throw{code:'unavailable'}}
    if(r.status===401){LS.del('oc-key');toast('Senha inválida. Entre de novo.');setTimeout(()=>location.reload(),1500);throw{code:'unauthorized'}}
    if(r.status===413)throw{code:'too_large'};
    if(!r.ok)throw{code:'unavailable',status:r.status};return r.json()};
  const subs={};let v=-1;
  const emit=meta=>{if(!meta||meta.v===v)return;v=meta.v;LS.set('oc-meta-cache',meta);
    COLLS.forEach(c=>{const m=meta[c]||{};const list=Object.entries(m).map(([id,d])=>Object.assign({id},d));(subs[c]||[]).forEach(cb=>cb(list))})};
  let q=Promise.resolve();
  const op=o=>{const p=q.then(()=>withRetry(()=>call('POST','meta',{ops:[o]}))).then(emit);q=p.catch(()=>{});return p};
  let polling=false;
  async function poll(){if(polling)return;polling=true;try{emit(await call('GET','meta'));if($('#status').dataset.k==='err'&&!S.dirty)setStatus('ok')}catch(e){if(e.code!=='unauthorized')setStatus('offline')}finally{polling=false}}
  return{kind:'api',
    start(){const cached=LS.get('oc-meta-cache',null);if(cached){emit(cached);v=-1}poll();
      setInterval(()=>{if(document.visibilityState==='visible')poll()},15000);
      window.addEventListener('focus',poll);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')poll()});window.addEventListener('online',poll)},
    watch(c,cb){(subs[c]=subs[c]||[]).push(cb)},
    set:(c,id,d)=>op({op:'set',coll:c,id,data:d}),
    update:(c,id,d)=>op({op:'update',coll:c,id,data:d}),
    del:(c,id)=>op({op:'del',coll:c,id}),
    getContent:async id=>(await withRetry(()=>call('GET','content?page='+encodeURIComponent(id)))).html||'',
    putContent:(id,html)=>withRetry(()=>call('PUT','content?page='+encodeURIComponent(id),{html})),
    delContent:id=>withRetry(()=>call('DELETE','content?page='+encodeURIComponent(id))),
    async contents(ids){const out={};let batch=[],size=0;const batches=[];
      ids.forEach(id=>{const s=(pageById(id)||{}).size||20000;if(batch.length&&(size+s>2500000||batch.length>=40)){batches.push(batch);batch=[];size=0}batch.push(id);size+=s});if(batch.length)batches.push(batch);
      for(const b of batches)Object.assign(out,await withRetry(()=>call('POST','content-batch',{ids:b})));return out},
    async exportMeta(){const m=await call('GET','meta');const o={};COLLS.forEach(c=>o[c]=m[c]||{});return o},
    async replaceAll(meta){emit(await call('POST','meta-replace',{meta}))}}}
/* conteúdo em cache nesta sessão, para busca e modo Estudar */
const cCache=new Map();
async function contentsFor(pages){const need=pages.filter(p=>(p.rev||0)>0&&!(cCache.has(p.id)&&cCache.get(p.id).rev===p.rev));
  if(need.length){const got=await store.contents(need.map(p=>p.id));need.forEach(p=>cCache.set(p.id,{rev:p.rev,html:got[p.id]||''}))}
  const o={};pages.forEach(p=>{const c=cCache.get(p.id);o[p.id]=c&&c.rev===p.rev?c.html:''});return o}

/* ---------- status / toast ---------- */
function setStatus(k){
  const local=store&&store.kind==='local';
  const map={ok:['ok',local?'Salvo neste aparelho':'Salvo'],dirty:['pending','Editando…'],saving:['pending','Salvando…'],
    err:['err',navigator.onLine===false?'Sem internet. Guardado neste aparelho':'Erro ao salvar. Tentando de novo…'],
    conn:['pending','Conectando…'],lost:['err','Conexão perdida. Recarregue a página'],offline:['err','Sem conexão com o servidor']};
  const [d,t]=map[k]||map.ok;const el=$('#status');el.dataset.k=local&&k==='ok'?'local':d;el.querySelector('.st-text').textContent=t;el.title=t;
}
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3200)}

/* ---------- prefs ---------- */
const P=Object.assign({font:'serif',size:'m',sheetw:820,sidew:240,align:'left',theme:'auto'},LS.get('oc-prefs',{}));
function applyPrefs(){const r=document.documentElement;r.dataset.font=P.font;r.dataset.size=P.size;
  r.style.setProperty('--sheet-w',P.sheetw==='full'?'100%':P.sheetw+'px');r.style.setProperty('--side-w',P.sidew+'px');r.style.setProperty('--sheet-ml',P.align==='center'?'auto':'0');
  if(P.theme==='auto')delete r.dataset.theme;else r.dataset.theme=P.theme;LS.set('oc-prefs',P)}

/* ---------- menus & modals ---------- */
let openMenuEl=null;
function closeMenu(){if(openMenuEl){openMenuEl.remove();openMenuEl=null}}
function openMenu(anchor,items){
  closeMenu();const m=document.createElement('div');m.className='menu';m.setAttribute('role','menu');
  items.forEach(it=>{
    if(!it)return;
    if(it.sep){m.append(document.createElement('hr'));return}
    if(it.head){const h=document.createElement('div');h.className='mhead';h.textContent=it.head;m.append(h);return}
    if(it.swatches){const row=document.createElement('div');row.className='sw';it.swatches.forEach(([name,col])=>{const b=document.createElement('button');b.title=name;b.setAttribute('aria-label',name);
      if(col)b.style.background=col;else b.className='none';b.onclick=()=>{closeMenu();it.pick(col)};row.append(b)});m.append(row);return}
    const b=document.createElement('button');b.className='mi'+(it.danger?' danger':'');b.setAttribute('role','menuitem');
    b.innerHTML=(it.check!==undefined?`<span class="ck">${it.check?'✓':''}</span>`:'')+`<span>${esc(it.label)}</span>`;
    b.onclick=()=>{closeMenu();it.action()};m.append(b)});
  document.body.append(m);openMenuEl=m;
  const r=anchor.getBoundingClientRect(),w=m.offsetWidth,h=m.offsetHeight;
  let left=Math.min(r.left,innerWidth-w-8),top=r.bottom+4;if(top+h>innerHeight-8)top=Math.max(8,r.top-h-4);
  m.style.left=Math.max(8,left)+'px';m.style.top=top+'px';
}
document.addEventListener('pointerdown',e=>{if(openMenuEl&&!openMenuEl.contains(e.target))closeMenu();
  const sp=$('#searchPanel');if(!sp.hidden&&!sp.contains(e.target)&&e.target!==$('#q'))sp.hidden=true},true);
function modal(inner){const w=document.createElement('div');w.className='modal-wrap';w.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${inner}</div>`;document.body.append(w);return w}
function ask(title,label,value,okLabel){return new Promise(res=>{
  const w=modal(`<h2>${esc(title)}</h2><label>${esc(label)}<input type="text" enterkeyhint="done"></label><div class="actions"><button class="btn ghost" data-a="c">Cancelar</button><button class="btn primary" data-a="ok">${esc(okLabel||'Salvar')}</button></div>`);
  const inp=w.querySelector('input');inp.value=value||'';setTimeout(()=>{inp.focus();inp.select()},40);
  const done=v=>{w.remove();res(v)};
  w.addEventListener('click',e=>{const a=e.target.dataset&&e.target.dataset.a;if(a==='c'||e.target===w)done(null);if(a==='ok')done(inp.value.trim()||null)});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();done(inp.value.trim()||null)}if(e.key==='Escape')done(null)})})}
function confirmBox(title,text,okLabel){return new Promise(res=>{
  const w=modal(`<h2>${esc(title)}</h2><p>${esc(text)}</p><div class="actions"><button class="btn ghost" data-a="c">Cancelar</button><button class="btn danger" data-a="ok">${esc(okLabel)}</button></div>`);
  const done=v=>{w.remove();res(v)};w.addEventListener('click',e=>{const a=e.target.dataset&&e.target.dataset.a;if(a==='c'||e.target===w)done(false);if(a==='ok')done(true)})})}

/* ---------- navigation render ---------- */
function renderNav(){
  const nb=nbById(S.nb);
  $('#nbName').textContent=nb?nb.name:(S.loaded.notebooks?'Sem cadernos':'Carregando…');
  const tabs=$('#tabs');tabs.innerHTML='';
  const secs=secsOf(S.nb);
  secs.forEach(s=>{const b=document.createElement('button');b.className='tab'+(s.id===S.sec?' active':'');b.style.setProperty('--c',s.color||COLORS[0]);b.textContent=s.name;
    b.title=s.id===S.sec?'Toque de novo para opções da aba':s.name;
    b.onclick=()=>{if(s.id===S.sec)sectionMenu(b,s);else selectSection(s.id)};
    b.oncontextmenu=e=>{e.preventDefault();sectionMenu(b,s)};tabs.append(b)});
  if(nb){const add=document.createElement('button');add.className='tab add';add.innerHTML=svg('plus',16);add.title='Nova aba';add.setAttribute('aria-label','Nova aba');add.onclick=newSection;tabs.append(add)}
  const sec=secById(S.sec);document.documentElement.style.setProperty('--sec',sec?sec.color:'#D9D4C7');
  const ul=$('#pageList');ul.innerHTML='';
  const pgs=pagesOf(S.sec);
  $('#addPage').style.visibility=sec?'visible':'hidden';
  if(sec&&!pgs.length){const li=document.createElement('li');li.className='hint';li.textContent='Nenhuma página nesta aba ainda.';ul.append(li)}
  pgs.forEach(p=>{const li=document.createElement('li');li.className=(p.level?'l1 ':'')+(p.id===S.page&&S.view==='page'?'active':'');
    const b=document.createElement('button');b.className='pg';b.dataset.id=p.id;
    if(p.title)b.textContent=p.title;else b.innerHTML='<span class="untitled">Sem título</span>';
    b.onclick=()=>{if(p.id!==S.page||S.view!=='page')openPage(p.id);else closeDrawer()};
    b.oncontextmenu=e=>{e.preventDefault();pageMenu(b,p)};li.append(b);
    if(p.id===S.page&&S.view==='page'){const m=document.createElement('button');m.className='icon-btn more';m.innerHTML=svg('more',18);m.setAttribute('aria-label','Opções da página');m.onclick=()=>pageMenu(m,p);li.append(m)}
    ul.append(li)});
  renderEmpty();
}
function renderEmpty(){
  const sheet=$('#sheet'),empty=$('#empty'),fv=$('#filterView');
  $('#studyBtn').classList.toggle('on',S.view==='study');
  if(S.view==='study'){fv.hidden=false;sheet.hidden=true;empty.hidden=true;$('#toolbar').classList.add('disabled');$('#tablebar').hidden=true;return}
  fv.hidden=true;
  if(S.page&&pageById(S.page)){sheet.hidden=false;empty.hidden=true;$('#toolbar').classList.remove('disabled');return}
  sheet.hidden=true;$('#toolbar').classList.add('disabled');$('#tablebar').hidden=true;
  if(!(S.loaded.notebooks&&S.loaded.sections&&S.loaded.pages)){empty.hidden=true;return}
  empty.hidden=false;const h=$('#emptyH'),p=$('#emptyP'),b=$('#emptyBtn');
  if(!S.notebooks.length){h.textContent='Crie seu primeiro caderno';p.textContent='Um caderno reúne abas, e cada aba reúne páginas.';b.textContent='Criar caderno';b.onclick=newNotebook}
  else if(!secsOf(S.nb).length){h.textContent='Este caderno ainda não tem abas';p.textContent='Crie uma aba para cada matéria ou assunto.';b.textContent='Criar aba';b.onclick=newSection}
  else{h.textContent='Esta aba ainda não tem páginas';p.textContent='Crie uma página para começar a escrever.';b.textContent='Criar página';b.onclick=newPage}
}
function renderMeta(){const p=pageById(S.page);if(!p){$('#meta').textContent='';return}
  const t=p.updatedAt||p.createdAt;$('#meta').textContent=t?'Atualizada em '+new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):''}

/* ---------- selection logic ---------- */
function reconcile(){
  const nbs=S.notebooks.slice().sort(byOrder);
  if(!nbById(S.nb))S.nb=(nbs[0]||{}).id||null;
  const secs=secsOf(S.nb);
  if(!secs.find(s=>s.id===S.sec)){const sv=LS.get('oc-sec:'+S.nb);S.sec=(secs.find(s=>s.id===sv)||secs[0]||{}).id||null}
  const pgs=pagesOf(S.sec);let target=S.page;
  if(!pgs.find(p=>p.id===target)){const sv=LS.get('oc-page:'+S.sec);target=(pgs.find(p=>p.id===sv)||pgs[0]||{}).id||null}
  renderNav();
  if(target!==S.page)openPage(target);
}
function selectNotebook(id){S.nb=id;LS.set('oc-nb',id);S.sec=null;reconcile()}
function selectSection(id){S.sec=id;LS.set('oc-sec:'+S.nb,id);reconcile()}

/* ---------- page load / save ---------- */
async function loadHtml(id){const p=pageById(id);if(p&&!(p.rev>0))return '';const html=await store.getContent(id);if(p)cCache.set(id,{rev:p.rev,html});return html}
async function openPage(id){
  const token=++S.loadToken;
  if(S.dirty)await save(true);
  if(token!==S.loadToken)return;
  S.page=id;S.view='page';S.dirty=false;hideConflict();closeDrawer();
  renderNav();
  if(!id)return;
  LS.set('oc-page:'+S.sec,id);
  const p=pageById(id);titleEl.value=p?p.title||'':'';renderMeta();
  editor.classList.add('loading');editor.innerHTML='';
  let html='';try{html=await loadHtml(id)}catch(e){toast('Não foi possível carregar a página.')}
  if(token!==S.loadToken)return;
  editor.classList.remove('loading');editor.innerHTML=html||'<p><br></p>';syncTagLabels(editor);
  S.loadedRev=(pageById(id)||{}).rev||0;lastRange=null;
  const d=LS.get('oc-draft:'+id);
  if(d){if(d.baseRev===S.loadedRev&&d.html!==html){editor.innerHTML=d.html;syncTagLabels(editor);S.dirty=true;setStatus('dirty');scheduleSave();toast('Recuperei alterações que ainda não tinham sido salvas.')}else LS.del('oc-draft:'+id)}
  scroller.scrollTop=0;
  if(p&&!p.title&&!html)setTimeout(()=>titleEl.focus(),50);
}
let saveTimer=null,draftTimer=null,saveChain=Promise.resolve();
function markDirty(){if(!S.page)return;S.dirty=true;setStatus('dirty');scheduleSave();
  clearTimeout(draftTimer);const id=S.page,base=S.loadedRev;draftTimer=setTimeout(()=>{if(S.page===id&&S.dirty)LS.set('oc-draft:'+id,{html:editor.innerHTML,baseRev:base})},500)}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>save(),1500)}
async function writePage(id,html){
  const p=pageById(id);if(!p)return;
  await store.putContent(id,html);
  const rev=Date.now();if(S.page===id)S.loadedRev=rev;cCache.set(id,{rev,html});
  await store.update('pages',id,{rev,editor:SESSION,updatedAt:rev,size:html.length});
}
function save(force){
  clearTimeout(saveTimer);
  if(!S.dirty||!S.page)return saveChain;
  if(S.conflict&&!force)return saveChain;
  const id=S.page,html=editor.innerHTML;S.dirty=false;setStatus('saving');
  saveChain=saveChain.then(()=>writePage(id,html)).then(()=>{
    if(!(S.page===id&&S.dirty)){LS.del('oc-draft:'+id)}
    if(!S.dirty)setStatus('ok');renderMeta();
  }).catch(e=>{
    if(e&&e.code==='quota_exceeded')toast('O espaço deste aparelho está cheio.');
    if(e&&e.code==='too_large')toast('Esta página ficou grande demais para salvar. Divida o texto em duas páginas.');
    if(S.page===id){S.dirty=true;setStatus('err');clearTimeout(saveTimer);saveTimer=setTimeout(()=>save(),6000)}
    else toast('Uma página não foi salva. As alterações ficaram guardadas neste aparelho.');
  });
  return saveChain;
}
function showConflict(){S.conflict=true;$('#conflict').hidden=false}
function hideConflict(){S.conflict=false;$('#conflict').hidden=true}
$('#cfTheirs').onclick=async()=>{S.dirty=false;LS.del('oc-draft:'+S.page);hideConflict();await reloadCurrent();setStatus('ok')};
$('#cfMine').onclick=()=>{const p=pageById(S.page);S.loadedRev=p?p.rev||0:0;hideConflict();S.dirty=true;save()};
async function reloadCurrent(){const id=S.page,tok=S.loadToken;let html;try{html=await loadHtml(id)}catch(e){return}
  if(id!==S.page||tok!==S.loadToken)return;if(S.dirty){showConflict();return}
  const st=scroller.scrollTop;editor.innerHTML=html||'<p><br></p>';syncTagLabels(editor);S.loadedRev=(pageById(id)||{}).rev||0;scroller.scrollTop=st}
let titlePending=false;
function checkRemote(){const p=pageById(S.page);if(!p)return;renderMeta();
  if(document.activeElement!==titleEl&&!titlePending&&(p.title||'')!==titleEl.value)titleEl.value=p.title||'';
  if((p.rev||0)>S.loadedRev&&p.editor!==SESSION){if(S.dirty)showConflict();else reloadCurrent()}}

  upsertLocal('notebooks',Object.assign({id},nb));upsertLocal('sections',Object.assign({id:sid},sec));selectNotebook(id)}

function failed(e){toast(e&&e.code==='quota_exceeded'?'O armazenamento está cheio. Exclua itens antigos para criar novos.':'Não foi possível salvar. Verifique a conexão e tente de novo.')}

/* ---------- editor commands ---------- */
let lastRange=null,curHL=LS.get('oc-hl','#FFF59D'),curFG=LS.get('oc-fg','#C62828');
document.addEventListener('selectionchange',()=>{const s=getSelection();if(s.rangeCount&&editor.contains(s.anchorNode)){lastRange=s.getRangeAt(0).cloneRange();updateTB()}});
function restore(){const s0=getSelection();if(document.activeElement===editor&&s0.rangeCount&&editor.contains(s0.anchorNode))return;
  editor.focus({preventScroll:true});const s=getSelection();
  if(lastRange&&editor.contains(lastRange.startContainer)){s.removeAllRanges();s.addRange(lastRange)}
  else if(!s.rangeCount||!editor.contains(s.anchorNode)){const r=document.createRange();r.selectNodeContents(editor);r.collapse(false);s.removeAllRanges();s.addRange(r)}}
function cmd(c,v,css){restore();try{document.execCommand('styleWithCSS',false,!!css)}catch(e){}document.execCommand(c,false,v==null?null:v);
  const s=getSelection();if(s.rangeCount)lastRange=s.getRangeAt(0).cloneRange();updateTB()}
function highlight(col){restore();try{document.execCommand('styleWithCSS',false,true)}catch(e){}
  if(!document.execCommand('hiliteColor',false,col||'transparent'))document.execCommand('backColor',false,col||'transparent');updateTB()}
function textColor(col){cmd('foreColor',col||'inherit',true);if(!col){restore();document.execCommand('removeFormat')}}
function blockOf(n){n=n&&(n.nodeType===1?n:n.parentNode);const b=n&&n.closest&&n.closest('p,li,h1,h2,h3,blockquote,td,th,div');return b&&b!==editor&&editor.contains(b)?b:null}
function selBlocks(){const s=getSelection();if(!s.rangeCount||!editor.contains(s.anchorNode))return[];const r=s.getRangeAt(0);
  if(r.collapsed){const b=blockOf(r.startContainer);return b?[b]:[]}
  const all=[...editor.querySelectorAll('p,li,h1,h2,h3,blockquote,td,th')].filter(b=>r.intersectsNode(b));
  const leaf=all.filter(b=>!all.some(o=>o!==b&&b.contains(o)));if(leaf.length)return leaf;const b=blockOf(r.startContainer);return b?[b]:[]}
const tagIn=(b,id)=>[...b.children].find(c=>c.classList&&c.classList.contains('tag')&&c.dataset.tag===id);
function toggleTag(id){if(!tagById(id))return;restore();let bs=selBlocks();
  if(!bs.length){document.execCommand('formatBlock',false,'p');bs=selBlocks()}if(!bs.length)return;
  const allHave=bs.every(b=>tagIn(b,id));
  bs.forEach(b=>{const ex=tagIn(b,id);if(allHave){if(ex)ex.remove()}else if(!ex){let ref=b.firstChild;while(ref&&ref.nodeType===1&&ref.classList.contains('tag'))ref=ref.nextSibling;b.insertBefore(mkTag(id),ref)}});
  markDirty();updateTB()}
function tagMenu(anchor){restore();const bs=selBlocks();const on=id=>bs.length&&bs.every(b=>tagIn(b,id));
  openMenu(anchor,[{head:bs.length>1?'Marcar os '+bs.length+' parágrafos selecionados':'Marcar este parágrafo'},
    ...tagList().map((t,i)=>({label:t.label+(i<9?'   (Ctrl+'+(i+1)+')':''),check:!!on(t.id),action:()=>toggleTag(t.id)})),
    {sep:1},{label:'Gerenciar marcadores…',action:manageTags},{label:'Estudar por marcador…',action:openStudy}])}
function renderTagQuick(){const q=$('#tagQuick');if(!q)return;q.innerHTML='';
  tagList().slice(0,6).forEach((t,i)=>{const b=document.createElement('button');b.className='tb tag-btn';b.title='Marcador '+t.label+(i<9?' (Ctrl+'+(i+1)+')':'');b.setAttribute('aria-label',b.title);
    b.append(mkTag(t.id));b.addEventListener('pointerdown',e=>e.preventDefault());b.onclick=()=>toggleTag(t.id);q.append(b)})}
function curCell(){const s=getSelection();let n=s.rangeCount&&editor.contains(s.anchorNode)?s.anchorNode:(lastRange&&lastRange.startContainer);
  n=n&&(n.nodeType===1?n:n.parentNode);const c=n&&n.closest&&n.closest('td,th');return c&&editor.contains(c)?c:null}
function tableOp(op){const c=curCell();if(!c)return;const tr=c.parentNode,table=c.closest('table'),rows=[...table.rows],ci=[...tr.children].indexOf(c);
  const cell=tag=>{const e=document.createElement(tag);e.innerHTML='<br>';return e};
  const killTable=()=>{const p=document.createElement('p');p.innerHTML='<br>';table.replaceWith(p);lastRange=null};
  if(op==='rowAbove'||op==='rowBelow'){const n=document.createElement('tr');[...tr.children].forEach(()=>n.append(cell('td')));op==='rowAbove'?tr.before(n):tr.after(n)}
  else if(op==='colLeft'||op==='colRight'){rows.forEach(r=>{const ref=r.children[Math.min(ci,r.children.length-1)];const e=cell(ref&&ref.tagName==='TH'?'th':'td');if(!ref)r.append(e);else op==='colLeft'?ref.before(e):ref.after(e)})}
  else if(op==='delRow'){if(rows.length<=1)killTable();else tr.remove()}
  else if(op==='delCol'){if(tr.children.length<=1)killTable();else rows.forEach(r=>r.children[ci]&&r.children[ci].remove())}
  else if(op==='delTable')killTable();
  markDirty();updateTB()}
document.querySelectorAll('#tablebar [data-t]').forEach(b=>{b.addEventListener('pointerdown',e=>e.preventDefault());b.onclick=()=>tableOp(b.dataset.t)});

function tablePicker(){
  const w=modal(`<h2>Inserir tabela</h2><div class="grid-label" id="gl">Toque para escolher o tamanho</div><div class="grid" id="grid"></div><label class="chk"><input type="checkbox" id="hdr" checked> Primeira linha como cabeçalho</label><div class="actions"><button class="btn ghost" data-a="c">Cancelar</button></div>`);
  const g=w.querySelector('#grid');for(let r=1;r<=8;r++)for(let c=1;c<=8;c++){const i=document.createElement('i');i.dataset.r=r;i.dataset.c=c;g.append(i)}
  const mark=(r,c)=>{g.querySelectorAll('i').forEach(i=>i.classList.toggle('on',+i.dataset.r<=r&&+i.dataset.c<=c));w.querySelector('#gl').textContent=r+' linha'+(r>1?'s':'')+' × '+c+' coluna'+(c>1?'s':'')};
  const at=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.parentNode===g?el:null};
  g.addEventListener('pointermove',e=>{const i=at(e);if(i)mark(+i.dataset.r,+i.dataset.c)});
  g.addEventListener('pointerup',e=>{const i=at(e);if(!i)return;const r=+i.dataset.r,c=+i.dataset.c,hdr=w.querySelector('#hdr').checked;w.remove();insertTable(r,c,hdr)});
  w.addEventListener('click',e=>{if(e.target===w||(e.target.dataset&&e.target.dataset.a==='c'))w.remove()})}
function insertTable(r,c,hdr){let h='<table><tbody>';for(let i=0;i<r;i++){h+='<tr>';for(let j=0;j<c;j++)h+=(hdr&&i===0)?'<th><br></th>':'<td><br></td>';h+='</tr>'}h+='</tbody></table><p><br></p>';cmd('insertHTML',h);markDirty()}

function paintSw(){const h=$('#hlb i'),f=$('#fgb i');if(h)h.style.setProperty('--hl',curHL);if(f)f.style.setProperty('--hl',curFG)}
function updateTB(){
  document.querySelectorAll('#toolbar [data-st]').forEach(b=>{let on=false;try{on=document.queryCommandState(b.dataset.st)}catch(e){}b.classList.toggle('on',on)});
  const blk=$('#blk');if(blk){let v='';try{v=(document.queryCommandValue('formatBlock')||'').toLowerCase()}catch(e){}blk.value=['h1','h2','h3','blockquote'].includes(v)?v:'p'}

/* ---------- paste sanitize ---------- */
const MAP={B:'b',STRONG:'b',I:'i',EM:'i',U:'u',S:'s',STRIKE:'s',DEL:'s',P:'p',DIV:'p',BR:'br',H1:'h1',H2:'h2',H3:'h3',H4:'h3',H5:'h3',H6:'h3',UL:'ul',OL:'ol',LI:'li',TABLE:'table',THEAD:'thead',TBODY:'tbody',TFOOT:'tbody',TR:'tr',TD:'td',TH:'th',BLOCKQUOTE:'blockquote',SPAN:'span',FONT:'span',MARK:'span',A:'span',SUB:'sub',SUP:'sup'};
const DROP=new Set(['SCRIPT','STYLE','META','LINK','TITLE','HEAD','IFRAME','OBJECT','EMBED','IMG','SVG','NOSCRIPT','TEMPLATE','BUTTON','INPUT','SELECT','TEXTAREA','VIDEO','AUDIO','CANVAS','COLGROUP','COL','PICTURE']);
function rgb(c){c=(c||'').trim().toLowerCase();let m;
  if((m=c.match(/^#([0-9a-f]{3})$/)))return m[1].split('').map(x=>parseInt(x+x,16)).concat(1);
  if((m=c.match(/^#([0-9a-f]{6})$/)))return[0,2,4].map(i=>parseInt(m[1].substr(i,2),16)).concat(1);
  if((m=c.match(/^rgba?\(([^)]+)\)/))){const p=m[1].split(/[ ,\/]+/).filter(Boolean).map(parseFloat);return[p[0],p[1],p[2],p.length>3?p[3]:1]}
  const named={white:[255,255,255,1],black:[0,0,0,1],transparent:[0,0,0,0],yellow:[255,255,0,1]};return named[c]||null}
function keepStyle(n,isBlock){const s=n.style,out=[];
  const bg=rgb(s.backgroundColor);if(bg&&bg[3]>0.1&&!(bg[0]>235&&bg[1]>235&&bg[2]>235))out.push(`background-color:rgb(${bg[0]},${bg[1]},${bg[2]})`);
  const fc=rgb(s.color||(n.getAttribute&&n.getAttribute('color')));if(fc&&fc[3]>0.1&&(Math.max(fc[0],fc[1],fc[2])-Math.min(fc[0],fc[1],fc[2])>40))out.push(`color:rgb(${fc[0]},${fc[1]},${fc[2]})`);
  const fw=s.fontWeight;if(fw==='bold'||parseInt(fw)>=600)out.push('font-weight:bold');
  if(s.fontStyle==='italic')out.push('font-style:italic');
  const td=(s.textDecorationLine||s.textDecoration||'');if(/underline/.test(td))out.push('text-decoration:underline');else if(/line-through/.test(td))out.push('text-decoration:line-through');
  if(isBlock&&/^(center|right|justify)$/.test(s.textAlign))out.push('text-align:'+s.textAlign);
  return out.join(';')}
function walk(src,dst){for(const n of Array.from(src.childNodes)){
  if(n.nodeType===3){dst.append(document.createTextNode(n.nodeValue));continue}
  if(n.nodeType!==1)continue;const t=n.tagName.toUpperCase();if(DROP.has(t))continue;
  if(t==='SPAN'&&n.classList.contains('tag')&&n.dataset.tag&&/^[\w.~:@+-]{1,60}$/.test(n.dataset.tag)){const s=mkTag(n.dataset.tag);if(!tagById(n.dataset.tag))s.textContent=n.textContent.slice(0,24);dst.append(s);continue}
  const m=MAP[t];if(!m){walk(n,dst);continue}
  const e=document.createElement(m);const block=/^(p|h1|h2|h3|li|td|th|blockquote)$/.test(m);
  const st=keepStyle(n,block);if(st)e.setAttribute('style',st);if(t==='MARK'&&!st)e.style.backgroundColor='#FFF59D';
  if((m==='td'||m==='th')){['colspan','rowspan'].forEach(a=>{if(n.getAttribute(a))e.setAttribute(a,n.getAttribute(a))})}
  walk(n,e);
  if(m==='span'&&!e.getAttribute('style')){while(e.firstChild)dst.append(e.firstChild)}else dst.append(e)}}
function sanitize(html){const doc=new DOMParser().parseFromString(html,'text/html');const d=document.createElement('div');walk(doc.body,d);return d.innerHTML}
editor.addEventListener('paste',e=>{const cd=e.clipboardData;if(!cd)return;const html=cd.getData('text/html'),text=cd.getData('text/plain');
  if(!html&&!text)return;e.preventDefault();
  let out=html?sanitize(html):text.split(/\r?\n/).map(l=>'<p>'+(esc(l)||'<br>')+'</p>').join('');
  if(!html&&!/\n/.test(text))out=esc(text);
  restore();document.execCommand('insertHTML',false,out);markDirty()});
editor.addEventListener('input',markDirty);
editor.addEventListener('keydown',e=>{
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&!e.shiftKey&&!e.altKey&&/^[1-9]$/.test(e.key)){e.preventDefault();const t=tagList()[+e.key-1];if(t)toggleTag(t.id);return}
  if(mod&&e.shiftKey&&(e.key==='H'||e.key==='h')){e.preventDefault();highlight(curHL);return}
  if(e.key==='Tab'){const c=curCell();e.preventDefault();
    if(c){const cells=[...c.closest('table').querySelectorAll('td,th')];let i=cells.indexOf(c)+(e.shiftKey?-1:1);
      if(i>=cells.length){tableOp('rowBelow');const cs=[...c.closest('table').querySelectorAll('td,th')];i=cells.length;var tgt=cs[i]}else var tgt=cells[i];
      if(tgt){const r=document.createRange();r.selectNodeContents(tgt);r.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(r)}return}
    const inList=blockOf(getSelection().anchorNode);if(inList&&inList.tagName==='LI'){document.execCommand(e.shiftKey?'outdent':'indent')}else if(!e.shiftKey)document.execCommand('insertText',false,'\u2003');}
});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&(e.key==='s'||e.key==='S')){e.preventDefault();save(true)}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});
window.addEventListener('pagehide',()=>save());
window.addEventListener('online',()=>{if(S.dirty)save()});
window.addEventListener('offline',()=>{if(S.dirty)setStatus('err')});

/* ---------- search ---------- */
const nch=ch=>{const r=ch.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();return r.length===1?r:(r.length?r[0]:ch)};
const norm=s=>s.split('').map(nch).join('');
function htmlText(h){const t=document.createElement('template');t.innerHTML=(h||'').replace(/<\/(p|div|li|h\d|td|th|tr|blockquote)>|<br\s*\/?>/gi,'$& ');return (t.content.textContent||'').replace(/\s+/g,' ')}
let lastQ='';
async function runSearch(q){const panel=$('#searchPanel');q=q.trim();if(!q){panel.hidden=true;return}lastQ=q;
  const r=$('#q').getBoundingClientRect();panel.style.top=(r.bottom+6)+'px';panel.style.left=Math.max(8,Math.min(r.left,innerWidth-panel.offsetWidth-8))+'px';
  panel.hidden=false;panel.innerHTML='<div class="note">Buscando…</div>';
  await save(true);
  let by={};try{by=await contentsFor(S.pages)}catch(e){panel.innerHTML='<div class="note">Não foi possível buscar agora. Verifique a conexão.</div>';return}
  if(q!==lastQ)return;
  const nq=norm(q);const res=[];
  S.pages.forEach(p=>{const sec=secById(p.sectionId);if(!sec)return;const text=htmlText(by[p.id]||'');const nt=norm(text);
    const ti=norm(p.title||'').indexOf(nq),ci=nt.indexOf(nq);if(ti<0&&ci<0)return;
    let snip='';if(ci>=0){const a=Math.max(0,ci-60),b=Math.min(text.length,ci+q.length+90);snip=(a>0?'…':'')+esc(text.slice(a,ci))+'<mark>'+esc(text.slice(ci,ci+q.length))+'</mark>'+esc(text.slice(ci+q.length,b))+(b<text.length?'…':'')}
    const nb=nbById(sec.notebookId);res.push({p,sec,nb,snip,score:(ti>=0?0:1)})});
  res.sort((a,b)=>a.score-b.score);
  if(!res.length){panel.innerHTML=`<div class="note">Nada encontrado para “${esc(q)}”.</div>`;return}
  panel.innerHTML='';res.slice(0,60).forEach(r=>{const b=document.createElement('button');b.className='res';
    b.innerHTML=`<strong>${esc(r.p.title||'Sem título')}</strong><small>${esc((r.nb?r.nb.name+' / ':'')+r.sec.name)}</small>${r.snip?'<span>'+r.snip+'</span>':''}`;
    b.onclick=()=>{panel.hidden=true;gotoPage(r.p.id,q)};panel.append(b)});
  if(res.length>60){const n=document.createElement('div');n.className='note';n.textContent=`Mostrando 60 de ${res.length} resultados. Refine a busca.`;panel.append(n)}}
async function gotoPage(pid,q){const p=pageById(pid);if(!p)return;const s=secById(p.sectionId);if(!s)return;
  S.nb=s.notebookId;LS.set('oc-nb',S.nb);S.sec=s.id;LS.set('oc-sec:'+S.nb,s.id);LS.set('oc-page:'+s.id,pid);
  if(S.page!==pid||S.view!=='page')await openPage(pid);else renderNav();if(q)findInEditor(q)}
function findInEditor(q){const nq=norm(q);const w=document.createTreeWalker(editor,NodeFilter.SHOW_TEXT);const nodes=[];let all='';let n;
  while((n=w.nextNode())){nodes.push([n,all.length]);all+=norm(n.nodeValue)}
  const i=all.indexOf(nq);if(i<0)return;const pos=k=>{for(let j=nodes.length-1;j>=0;j--)if(nodes[j][1]<=k)return[nodes[j][0],k-nodes[j][1]]};
  const [sn,so]=pos(i),[en,eo]=pos(i+nq.length-1);const r=document.createRange();r.setStart(sn,so);r.setEnd(en,eo+1);
  const rect=r.getBoundingClientRect(),sr=scroller.getBoundingClientRect();scroller.scrollTop+=rect.top-sr.top-140;
  if(window.CSS&&CSS.highlights&&window.Highlight){CSS.highlights.set('hit',new Highlight(r));setTimeout(()=>CSS.highlights.delete('hit'),5000)}
  else{const s=getSelection();s.removeAllRanges();s.addRange(r)}}
let searchT;
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();clearTimeout(searchT);runSearch(e.target.value)}if(e.key==='Escape'){$('#searchPanel').hidden=true;e.target.blur()}});
$('#q').addEventListener('input',e=>{clearTimeout(searchT);const v=e.target.value;if(!v.trim()){$('#searchPanel').hidden=true;return}if(v.trim().length>=3)searchT=setTimeout(()=>runSearch(v),600)});

/* ---------- marcadores: gerenciar ---------- */
async function ensureTags(){if(S.tags.length)return;for(const t of DEFAULT_TAGS)await store.set('tags',t.id,{label:t.label,c:t.c,order:t.order});S.tags=DEFAULT_TAGS.map(t=>Object.assign({},t))}
async function tagWrite(id,patch){try{await ensureTags();await store.update('tags',id,patch);upsertLocal('tags',Object.assign({id},patch));onTags()}catch(e){failed(e)}}
function manageTags(){
  const w=modal(`<h2>Marcadores</h2><p>Use para bancas, tribunais ou temas. Os 9 primeiros têm atalho Ctrl+1 a Ctrl+9, na ordem da lista.</p><div class="tagrows"></div><button class="btn ghost" data-a="add">+ Novo marcador</button><div class="actions"><button class="btn primary" data-a="c">Pronto</button></div>`);
  const rows=w.querySelector('.tagrows');
  const draw=focusId=>{rows.innerHTML='';const list=tagList();list.forEach((t,i)=>{const[bg,fg]=tagCol(t);const r=document.createElement('div');r.className='tagrow';
    r.innerHTML=`<button class="dot" title="Trocar cor" aria-label="Trocar cor" style="background:${bg};border-color:${fg}"></button><input type="text" maxlength="24" aria-label="Nome do marcador"><span class="kbd">${i<9?'Ctrl+'+(i+1):''}</span><button class="icon-btn" data-m="up" aria-label="Subir">↑</button><button class="icon-btn" data-m="dn" aria-label="Descer">↓</button><button class="icon-btn" data-m="del" aria-label="Excluir" style="color:var(--danger)">✕</button>`;
    const inp=r.querySelector('input');inp.value=t.label;
    const commit=()=>{const v=inp.value.trim();if(v&&v!==t.label)tagWrite(t.id,{label:v});else inp.value=t.label};
    inp.addEventListener('change',commit);inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();inp.blur()}});
    r.querySelector('.dot').onclick=async()=>{await tagWrite(t.id,{c:((t.c||0)+1)%TAGCOL.length});draw()};
    r.querySelector('[data-m=up]').onclick=async()=>{await ensureTags();await reorder('tags',tagList(),tagById(t.id),-1);onTags();draw()};
    r.querySelector('[data-m=dn]').onclick=async()=>{await ensureTags();await reorder('tags',tagList(),tagById(t.id),1);onTags();draw()};
    r.querySelector('[data-m=del]').onclick=async()=>{if(!await confirmBox('Excluir o marcador “'+t.label+'”?','Onde ele já foi aplicado, continuará aparecendo em cinza e pode ser removido à mão.','Excluir'))return;
      try{await ensureTags();await store.del('tags',t.id);S.tags=S.tags.filter(x=>x.id!==t.id);onTags();draw()}catch(e){failed(e)}};
    rows.append(r);if(t.id===focusId){setTimeout(()=>{inp.focus();inp.select()},30)}})};
  draw();
  w.addEventListener('click',async e=>{const a=e.target.dataset&&e.target.dataset.a;
    if(a==='c'||e.target===w){const ae=document.activeElement;if(ae&&ae.blur)ae.blur();w.remove()}
    if(a==='add'){try{await ensureTags();const id=uid(),list=tagList();const d={label:'Novo marcador',c:list.length%TAGCOL.length,order:nextOrder(list)};await store.set('tags',id,d);upsertLocal('tags',Object.assign({id},d));onTags();draw(id)}catch(err){failed(err)}}});
}

/* ---------- estudar por marcador ---------- */
const F={sel:[],mode:'any',scope:'nb',ctx:false};let study=null;
function loadF(){Object.assign(F,{sel:[],mode:'any',scope:'nb',ctx:false},LS.get('oc-filter:'+S.nb,{}))}
function saveF(){LS.set('oc-filter:'+S.nb,F)}
async function openStudy(){if(!S.nb){toast('Crie um caderno primeiro.');return}await save(true);S.view='study';hideConflict();closeDrawer();loadF();renderNav();
  const v=$('#filterView');v.innerHTML='<h2>Estudar por marcador</h2><p class="note">Reunindo os trechos marcados…</p>';scroller.scrollTop=0;
  const nb=S.nb;const secIds=new Set(secsOf(nb).map(s=>s.id));let by;
  try{by=await contentsFor(S.pages.filter(p=>secIds.has(p.sectionId)))}catch(e){v.innerHTML='<h2>Estudar por marcador</h2><p class="note">Não foi possível carregar agora. Verifique a conexão e toque em Estudar de novo.</p>';return}
  if(S.view!=='study'||S.nb!==nb)return;
  const secs=secsOf(nb),hits=[],blocks={};const SEL='p,li,h1,h2,h3,blockquote,table';
  secs.forEach(sec=>pagesOf(sec.id).forEach(p=>{const t=document.createElement('template');t.innerHTML=by[p.id]||'';
    const outer=[...t.content.querySelectorAll(SEL)].filter(b=>!(b.parentElement&&b.parentElement.closest(SEL)));
    const show=b=>b.tagName==='LI'?'<p>'+b.innerHTML+'</p>':b.outerHTML;blocks[p.id]=outer.map(show);
    const txt=b=>{const c=b.cloneNode(true);c.querySelectorAll('.tag').forEach(x=>x.remove());return(c.textContent||'').replace(/\s+/g,' ').trim()};
    outer.forEach((b,i)=>{
      if(b.tagName==='TABLE'){[...b.querySelectorAll('tr')].forEach(tr=>{const tg=[...new Set([...tr.querySelectorAll('.tag')].map(x=>x.dataset.tag))];if(tg.length)hits.push({p,sec,i,tags:tg,html:'<table><tbody>'+tr.outerHTML+'</tbody></table>',text:txt(tr)})})}
      else{const tg=[...new Set([...b.querySelectorAll('.tag')].map(x=>x.dataset.tag))];if(tg.length)hits.push({p,sec,i,tags:tg,html:show(b),text:txt(b)})}})}));
  study={nb,hits,blocks};drawStudy()}
function drawStudy(){const v=$('#filterView');if(!study||study.nb!==S.nb)return;const nb=nbById(S.nb);
  const secs=secsOf(S.nb);if(F.scope!=='nb'&&!secs.find(s=>s.id===F.scope))F.scope='nb';
  const inScope=study.hits.filter(h=>F.scope==='nb'||h.sec.id===F.scope);
  const tl=tagList();const count=id=>inScope.filter(h=>h.tags.includes(id)).length;
  const sel=F.sel.filter(id=>tagById(id));
  const match=h=>sel.length&&(F.mode==='any'?h.tags.some(x=>sel.includes(x)):sel.every(x=>h.tags.includes(x)));
  const res=inScope.filter(match);
  v.innerHTML=`<h2>Estudar por marcador</h2><p class="sub">Caderno ${esc(nb?nb.name:'')}. Escolha os marcadores do dia.</p>
    <div class="fchips">${tl.map(t=>`<button class="fchip" data-id="${esc(t.id)}" aria-pressed="${F.sel.includes(t.id)}"><span class="tag" data-tag="${esc(t.id)}">${esc(t.label)}</span>${count(t.id)}</button>`).join('')}</div>
    <div class="fopts">
      <select id="fMode" aria-label="Combinar marcadores"><option value="any">Trechos com qualquer um deles</option><option value="all">Só trechos com todos eles</option></select>
      <select id="fScope" aria-label="Onde procurar"><option value="nb">No caderno inteiro</option>${secs.map(s=>`<option value="${esc(s.id)}">Só na aba ${esc(s.name)}</option>`).join('')}</select>
      <label><input type="checkbox" id="fCtx"${F.ctx?' checked':''}> Mostrar contexto</label>
      <button class="btn ghost" id="fManage" style="padding:7px 10px">Gerenciar marcadores</button>
    </div><div id="fRes"></div>`;
  v.querySelector('#fMode').value=F.mode;v.querySelector('#fScope').value=F.scope;
  v.querySelectorAll('.fchip').forEach(b=>b.onclick=()=>{const id=b.dataset.id;F.sel=F.sel.includes(id)?F.sel.filter(x=>x!==id):F.sel.concat(id);saveF();drawStudy()});
  v.querySelector('#fMode').onchange=e=>{F.mode=e.target.value;saveF();drawStudy()};
  v.querySelector('#fScope').onchange=e=>{F.scope=e.target.value;saveF();drawStudy()};
  v.querySelector('#fCtx').onchange=e=>{F.ctx=e.target.checked;saveF();drawStudy()};
  v.querySelector('#fManage').onclick=manageTags;
  const out=v.querySelector('#fRes');
  if(!sel.length){out.innerHTML='<p class="note">Toque em um ou mais marcadores acima para ver só os trechos marcados com eles.</p>';return}
  if(!res.length){out.innerHTML='<p class="note">Nenhum trecho com '+(F.mode==='all'&&sel.length>1?'todos esses marcadores':'esses marcadores')+' '+(F.scope==='nb'?'neste caderno':'nesta aba')+'.</p>';return}
  let html=`<p class="sub" style="margin-top:12px">${res.length} trecho${res.length>1?'s':''} encontrado${res.length>1?'s':''}</p>`,lastSec=null,lastPage=null;
  res.forEach((h,k)=>{if(h.sec.id!==lastSec){html+=`<div class="grp-sec" style="--c:${esc(h.sec.color||'#D9D4C7')}">${esc(h.sec.name)}</div>`;lastSec=h.sec.id;lastPage=null}
    if(h.p.id!==lastPage){html+=`<div class="grp-page">${esc(h.p.title||'Sem título')}</div>`;lastPage=h.p.id}
    const bl=study.blocks[h.p.id]||[];const before=F.ctx&&h.i>0?bl[h.i-1]:'';const after=F.ctx?bl.slice(h.i+1,h.i+3).join(''):'';
    html+=`<div class="hit rich">${before?'<div class="ctx">'+before+'</div>':''}${h.html}${after?'<div class="ctx">'+after+'</div>':''}<button class="open" data-k="${k}">Abrir na página</button></div>`});
  out.innerHTML=html;syncTagLabels(out);
  out.querySelectorAll('.open').forEach(b=>b.onclick=()=>{const h=res[+b.dataset.k];gotoPage(h.p.id,h.text.slice(0,70))})}

/* ---------- ajustar larguras ---------- */
function makeGrip(grip,getLeft,apply,done){let on=false;const lab=$('#wlabel');
  grip.addEventListener('pointerdown',e=>{e.preventDefault();on=true;grip.setPointerCapture(e.pointerId);grip.classList.add('drag');document.body.style.cursor='col-resize'});
  grip.addEventListener('pointermove',e=>{if(!on)return;const w=apply(Math.round(e.clientX-getLeft()));lab.style.display='block';lab.textContent=w;lab.style.left=(e.clientX+14)+'px';lab.style.top=(e.clientY+10)+'px'});
  const end=()=>{if(!on)return;on=false;grip.classList.remove('drag');document.body.style.cursor='';lab.style.display='none';done()};
  grip.addEventListener('pointerup',end);grip.addEventListener('pointercancel',end)}
makeGrip($('#sheetGrip'),()=>$('#sheet').getBoundingClientRect().left,w=>{const max=scroller.clientWidth-($('#sheet').getBoundingClientRect().left-scroller.getBoundingClientRect().left);
  w=Math.max(380,Math.min(w,max));if(w>=max-6){P.sheetw='full';document.documentElement.style.setProperty('--sheet-w','100%');return 'Tela inteira'}
  P.sheetw=w;document.documentElement.style.setProperty('--sheet-w',w+'px');return w+' px'},()=>applyPrefs());
$('#sheetGrip').addEventListener('dblclick',()=>{P.sheetw=820;applyPrefs();toast('Largura padrão restaurada.')});
makeGrip($('#sideGrip'),()=>$('#side').getBoundingClientRect().left,w=>{w=Math.max(160,Math.min(w,480));P.sidew=w;document.documentElement.style.setProperty('--side-w',w+'px');return w+' px'},()=>applyPrefs());

/* ---------- backup ---------- */
async function exportBackup(){try{await save(true);toast('Preparando o backup…');const meta=await store.exportMeta();
  const pages=Object.entries(meta.pages||{}).map(([id,d])=>Object.assign({id},d));const content=await store.contents(pages.filter(p=>(p.rev||0)>0).map(p=>p.id));
  const blob=new Blob([JSON.stringify({app:'cadernos',version:1,exportedAt:new Date().toISOString(),meta,content})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cadernos-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}catch(e){toast('Não foi possível gerar o backup. Verifique a conexão.')}}
$('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;
  let data;try{data=JSON.parse(await file.text())}catch(err){toast('Arquivo de backup inválido.');return}
  if(!data||data.app!=='cadernos'||!data.meta){toast('Este arquivo não é um backup do Cadernos.');return}
  if(!await confirmBox('Restaurar este backup?','Tudo o que está no app agora será substituído pelo conteúdo do arquivo, em todos os aparelhos.','Restaurar'))return;
  try{toast('Restaurando…');S.dirty=false;clearTimeout(saveTimer);
    const ids=Object.keys(data.content||{});for(let i=0;i<ids.length;i++){await store.putContent(ids[i],data.content[ids[i]]||'');setStatusText('Restaurando '+(i+1)+' de '+ids.length+'…')}
    const meta=data.meta;Object.values(meta.pages||{}).forEach(p=>{delete p.chunks;delete p.editor;if(!(p.rev>0)&&data.content&&data.content[p.id])p.rev=Date.now()});
    await store.replaceAll(meta);cCache.clear();Object.keys(localStorage).filter(k=>k.startsWith('oc-draft:')).forEach(k=>LS.del(k));
    toast('Backup restaurado.');setTimeout(()=>location.reload(),900)}catch(err){toast('A restauração falhou no meio. Tente de novo; nada foi perdido do arquivo.')}});
function hasLocalNotes(){const m=LS.get('oc-local:notebooks',{});return m&&Object.keys(m).length>0}
async function recoverLocal(){
  const meta={};COLLS.forEach(c=>meta[c]=LS.get('oc-local:'+c,{}));
  const content={};Object.keys(meta.pages||{}).forEach(id=>{const v=LS.get('oc-local-c:'+id,'');if(v)content[id]=v});
  const n=Object.keys(meta.pages||{}).length;
  if(!await confirmBox('Recuperar '+n+' página(s) deste aparelho?','Elas foram escritas quando o servidor não estava funcionando. O conteúdo atual do servidor será substituído por elas, em todos os aparelhos. Se preferir, baixe antes um backup do que está no servidor.','Recuperar'))return;
  try{toast('Recuperando…');S.dirty=false;clearTimeout(saveTimer);const ids=Object.keys(content);
    for(let i=0;i<ids.length;i++){await store.putContent(ids[i],content[ids[i]]);setStatusText('Enviando '+(i+1)+' de '+ids.length+'…')}
    Object.values(meta.pages||{}).forEach(p=>{delete p.chunks;delete p.editor;if(content[p.id]&&!(p.rev>0))p.rev=Date.now()});
    await store.replaceAll(meta);
    const blob=new Blob([JSON.stringify({app:'cadernos',version:1,exportedAt:new Date().toISOString(),meta,content})],{type:'application/json'});
    COLLS.forEach(c=>LS.del('oc-local:'+c));ids.forEach(id=>LS.del('oc-local-c:'+id));
    try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cadernos-recuperado-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove()}catch(e){}
    toast('Notas recuperadas e enviadas para todos os aparelhos.');setTimeout(()=>location.reload(),1200)}
  catch(e){toast('A recuperação falhou. Nada foi apagado deste aparelho; tente de novo.')}}
function setStatusText(t){const el=$('#status');el.dataset.k='pending';el.querySelector('.st-text').textContent=t}

/* ---------- drawer ---------- */
function closeDrawer(){document.body.classList.remove('drawer-open')}
$('#drawerBtn').onclick=()=>document.body.classList.toggle('drawer-open');
$('#scrim').onclick=closeDrawer;

/* ---------- boot ---------- */
$('#drawerBtn').innerHTML=svg('menu',20);$('#prefsBtn').innerHTML=svg('gear',20);$('#searchIco').outerHTML=svg('search',16);$('#nbCaret').outerHTML=svg('caret',16);
$('#addPage').innerHTML=svg('plus',16)+'<span>Nova página</span>';$('#addPage').onclick=newPage;
$('#nbBtn').onclick=e=>notebookMenu(e.currentTarget);$('#studyIco').outerHTML=svg('filter',16);$('#studyBtn').onclick=()=>{if(S.view==='study')openPage(S.page);else openStudy()};$('#prefsBtn').onclick=e=>prefsMenu(e.currentTarget);
try{document.execCommand('defaultParagraphSeparator',false,'p')}catch(e){}
applyPrefs();buildToolbar();onTags();
function onData(c){if(!(S.loaded.notebooks&&S.loaded.sections&&S.loaded.pages))return;reconcile();if(c==='pages')checkRemote()}
function askKey(msg){return new Promise(res=>{
  const w=modal(`<h2>Entrar no Cadernos</h2><p>${esc(msg||'Digite a senha que você definiu no Netlify (variável APP_KEY). Ela fica guardada neste aparelho.')}</p><label>Senha<input type="password" autocomplete="current-password" enterkeyhint="go" style="display:block;width:100%;margin-top:6px;height:40px;border:1px solid var(--line-strong);border-radius:8px;padding:0 10px;background:var(--paper);font-size:16px"></label><div class="actions"><button class="btn primary" data-a="ok">Entrar</button></div>`);
  const inp=w.querySelector('input');setTimeout(()=>inp.focus(),50);const go=()=>{const v=inp.value.trim();if(v){w.remove();res(v)}};
  w.querySelector('[data-a=ok]').onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}})})}
function showLocalWarning(){$('#localWarn').hidden=false;$('#lwBackup').onclick=exportBackup;setTimeout(()=>{const el=$('#status');el.dataset.k='err';el.querySelector('.st-text').textContent='Só neste aparelho'},50)}
function fatal(title,text){$('#empty').hidden=false;$('#emptyH').textContent=title;$('#emptyP').textContent=text;$('#emptyBtn').textContent='Tentar de novo';$('#emptyBtn').onclick=()=>location.reload();setStatus('offline')}
async function connect(){
  if(!/^https?:$/.test(location.protocol))return localStore();
  let key=LS.get('oc-key',null),msg=null;
  for(;;){
    if(!key)key=await askKey(msg);
    let r;try{r=await fetch('/api/meta',{headers:{'x-app-key':key},cache:'no-store'})}
    catch(e){if(LS.get('oc-meta-cache',null)){toast('Sem conexão. Mostrando a última versão carregada.');return apiStore(key)}fatal('Sem conexão com o servidor','Verifique a internet e tente de novo.');return null}
    if(r.ok){LS.set('oc-key',key);return apiStore(key)}
    if(r.status===401){LS.del('oc-key');key=null;msg='Senha incorreta. Tente de novo.';continue}
    if(r.status===404){showLocalWarning();return localStore()}
    let j={};try{j=await r.json()}catch(e){}
    if(j.error==='no_key_configured'){fatal('Falta configurar a senha no Netlify','Crie a variável de ambiente APP_KEY no painel do Netlify e publique o site de novo.');return null}
    fatal('O servidor respondeu com erro '+r.status,'Tente de novo em instantes.');return null}}
async function init(){
  store=await connect();if(!store)return;
  setStatus('ok');
  store.watch('tags',list=>{S.tags=list.sort(byOrder);onTags()});
  ['notebooks','sections','pages'].forEach(c=>store.watch(c,list=>{S[c]=list.sort(byOrder);S.loaded[c]=true;onData(c)}));
  store.start();
}
init();
})();
</script>
